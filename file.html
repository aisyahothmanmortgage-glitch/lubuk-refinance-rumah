<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lubuk Refinance Rumah (LRR)</title>
  <style>
    body {
      background-color: #000;
      color: #daa520;
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1, h2 {
      color: #daa520;
      text-align: center;
    }
    h3 {
      color: #ebb832;
      margin-top: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 6px;
      border: 1px solid #daa520;
      background-color: #222;
      color: #daa520;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[type="range"] {
      width: 100%;
    }
    .container {
      max-width: 600px;
      margin: auto;
      border: 2px solid #daa520;
      padding: 20px;
      border-radius: 8px;
    }
    button {
      margin-top: 15px;
      background-color: #daa520;
      border: none;
      color: #000;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
    }
    button:hover {
      background-color: #c8961a;
    }
    .result-box {
      background-color: #daa520;
      color: #000;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Lubuk Refinance Rumah (LRR)</h1>

  <label for="clientName">Nama Pemohon</label>
  <input type="text" id="clientName" placeholder="Nama Penuh" />

  <label for="age">Umur Pemohon (tahun)</label>
  <input type="number" id="age" min="18" max="69" step="1" placeholder="Contoh: 35" />

  <label for="grossIncome">Gaji Kasar Bulanan (RM)</label>
  <input type="number" id="grossIncome" min="0" step="0.01" placeholder="Contoh: 5000" />

  <label for="netIncome">Gaji Bersih Bulanan (RM)</label>
  <input type="number" id="netIncome" min="0" step="0.01" placeholder="Contoh: 4200" />

  <label for="marketValue">Harga Pasaran Rumah (MV) (RM)</label>
  <input type="number" id="marketValue" min="0" step="1" placeholder="Contoh: 400000" />

  <label for="outstandingLoan">Baki Pinjaman Rumah Semasa (RM) (dari CCRIS)</label>
  <input type="number" id="outstandingLoan" min="0" step="1" placeholder="Contoh: 200000" />

  <label for="personalLoan">Baki Personal Loan (RM) (dari CCRIS)</label>
  <input type="number" id="personalLoan" min="0" step="1" placeholder="Contoh: 30000" />

  <label for="creditCard">Baki Kad Kredit (RM) (dari CCRIS)</label>
  <input type="number" id="creditCard" min="0" step="1" placeholder="Contoh: 20000" />

  <label for="margin">Margin Pembiayaan (%) <small>(75% - 100%)</small></label>
  <input type="range" id="margin" value="90" min="75" max="100" step="0.1" oninput="document.getElementById('marginValue').textContent = this.value + '%';" />
  <div><span id="marginValue">90%</span></div>

  <label for="tenureInput">Tempoh Pinjaman Baru (tahun)</label>
  <input type="number" id="tenureInput" min="1" max="35" step="1" placeholder="Isi atau biar auto kira ikut umur" />

  <label for="interestRate">Kadar Faedah Tahunan (%)</label>
  <select id="interestRate">
    <option value="3.85" selected>3.85%</option>
    <option value="4.10">4.10%</option>
    <option value="4.90">4.90%</option>
  </select>

  <label for="productType">Produk Bank</label>
  <select id="productType" onchange="adjustInterestRate()">
    <option value="BSN">BSN</option>
    <option value="AlRajhi">Al-Rajhi</option>
    <option value="CBP">CBP</option>
  </select>

  <label>Jenis Pembiayaan</label>
  <select id="loanType">
    <option value="Option1">Option 1: Normal Refinance</option>
    <option value="Option2">Option 2: Refinance + Debt Consolidation</option>
  </select>

  <label for="debtConsolPL">Jumlah Settlement Personal Loan (RM) <small>(Untuk Option 2)</small></label>
  <input type="number" id="debtConsolPL" min="0" step="1" value="0" />

  <label for="debtConsolCC">Jumlah Settlement Kad Kredit (RM) <small>(Untuk Option 2)</small></label>
  <input type="number" id="debtConsolCC" min="0" step="1" value="0" />

  <hr style="border-color:#daa520; margin-top:20px; margin-bottom:10px;">
  <h3>Komitmen Bulanan Sebelum Refinance (RM)</h3>

  <label for="commitCC">Komitmen Kad Kredit</label>
  <input type="number" id="commitCC" min="0" step="1" value="0" />

  <label for="commitPL">Komitmen Personal Loan</label>
  <input type="number" id="commitPL" min="0" step="1" value="0" />

  <label for="commitHL">Komitmen Pinjaman Rumah Semasa</label>
  <input type="number" id="commitHL" min="0" step="1" value="0" />

  <label for="commitOther">Komitmen Lain-lain (optional)</label>
  <input type="number" id="commitOther" min="0" step="1" value="0" />

  <button onclick="calculate()">KIRA</button>

  <div id="result" class="result-box" style="display:none;"></div>
</div>

<script>
function adjustInterestRate() {
  const product = document.getElementById('productType').value;
  const marketValue = Number(document.getElementById('marketValue').value);
  const interestRateSel = document.getElementById('interestRate');

  if (product === "BSN") {
    let loanEstimate = marketValue * 0.9;
    if(loanEstimate <= 250000){
      interestRateSel.value = "4.10";
    } else {
      interestRateSel.value = "3.65";
    }
  } else if (product === "CBP") {
    interestRateSel.value = "4.90";
  } else if (product === "AlRajhi") {
    interestRateSel.value = "3.85";
  }
}

function calculate() {
  let name = document.getElementById('clientName').value.trim();
  let age = Number(document.getElementById('age').value);
  let grossIncome = Number(document.getElementById('grossIncome').value);
  let netIncome = Number(document.getElementById('netIncome').value);
  let mv = Number(document.getElementById('marketValue').value);
  let outstandingLoan = Number(document.getElementById('outstandingLoan').value);
  let personalLoan = Number(document.getElementById('personalLoan').value);
  let creditCard = Number(document.getElementById('creditCard').value);
  let margin = Number(document.getElementById('margin').value) / 100;
  let tenureInput = Number(document.getElementById('tenureInput').value);
  let interestRate = Number(document.getElementById('interestRate').value) / 100;
  let product = document.getElementById('productType').value;
  let loanType = document.getElementById('loanType').value;
  let debtConsolPL = Number(document.getElementById('debtConsolPL').value);
  let debtConsolCC = Number(document.getElementById('debtConsolCC').value);

  if(!name){alert('Sila masukkan nama pemohon'); return;}
  if(!age || age < 18 || age > 69){alert('Sila masukkan umur 18-69 tahun'); return;}
  if(!grossIncome || grossIncome <=0){alert('Sila masukkan gaji kasar lebih dari 0'); return;}
  if(!netIncome || netIncome <=0){alert('Sila masukkan gaji bersih lebih dari 0'); return;}
  if(!mv || mv <=0){alert('Sila masukkan harga pasaran rumah yang betul'); return;}
  if(outstandingLoan === 0){alert('Sila masukkan baki pinjaman rumah semasa'); return;}
  if(margin < 0.75 || margin > 1){alert('Margin pembiayaan mesti antara 75% hingga 100%'); return;}

  let tenureMax = Math.min(35, 69 - age);
  let tenure = tenureInput > 0 ? Math.min(tenureInput, tenureMax) : tenureMax;

  if(product === "BSN"){
    let maxLoan90 = mv * 0.9;
    if(maxLoan90 <= 250000) interestRate = 0.041;
    else interestRate = 0.0365;
  } else if(product === "CBP"){
    interestRate = 0.049;
  } else if(product === "AlRajhi"){
    interestRate = 0.0385;
  }

  let financing90 = mv * 0.9;
  let fec = mv * 0.10; 
  let totalFinancing = financing90 + fec;

  if(loanType === "Option1") {
    let cashOut = financing90 - outstandingLoan;
    let netCashoutText = cashOut < 0 ? `NEGATIVE CASH OUT: RM ${Math.abs(cashOut).toFixed(2)}` : `RM ${cashOut.toFixed(2)}`;

    let monthlyInstallment = calculateReducingBalance(totalFinancing, interestRate, tenure);

    let serviceFee = calcServiceFee(totalFinancing);

    let maxDSR = grossIncome >= 5000 ? 0.8 : 0.6;

    let estCommitments = monthlyInstallment;

    let DSR = estCommitments / grossIncome;
    let NDI = netIncome - estCommitments;

    let statusText = "Layak";
    if (DSR > maxDSR) statusText = "Tidak Layak (DSR melebihi had)";
    if (NDI < 1100) statusText = "Tidak Layak (NDI kurang RM1,100)";

    // Komitmen sebelum refinance
    let commitCC = Number(document.getElementById('commitCC').value);
    let commitPL = Number(document.getElementById('commitPL').value);
    let commitHL = Number(document.getElementById('commitHL').value);
    let commitOther = Number(document.getElementById('commitOther').value);
    let totalCommitBefore = commitCC + commitPL + commitHL + commitOther;
    let totalCommitAfter = monthlyInstallment + commitOther;

    showResult({
      name, age, grossIncome, netIncome, mv, outstandingLoan,
      tenure, interestRate, financing90, fec, totalFinancing,
      cashOut: netCashoutText,
      monthlyInstallment, DSR, NDI, statusText, serviceFee,
      totalCommitBefore, totalCommitAfter,
      option: "OPTION 1 - NORMAL REFINANCE"
    });
  } else if(loanType === "Option2") {
    let availableCashOut = financing90 - outstandingLoan;
    let totalDebtSettlement = debtConsolPL + debtConsolCC;

    let netCashOut = availableCashOut - totalDebtSettlement;
    let netCashoutText = netCashOut < 0 ? `NEGATIVE: RM ${Math.abs(netCashOut).toFixed(2)}` : `RM ${netCashOut.toFixed(2)}`;

    let totalFinancingWithFEC = financing90 + fec;

    let monthlyInstallmentAcc1 = calculateReducingBalance(totalFinancingWithFEC, interestRate, tenure);

    const debtTenure = 10;
    let debtInterestRate = interestRate;
    if(product === "CBP") debtInterestRate = 0.049;
    let monthlyInstallmentAcc2 = calculateReducingBalance(totalDebtSettlement, debtInterestRate, debtTenure);

    let totalMonthlyInstallment = monthlyInstallmentAcc1 + monthlyInstallmentAcc2;

    let serviceFee = calcServiceFee(totalFinancingWithFEC);

    let maxDSR = grossIncome >= 5000 ? 0.8 : 0.6;
    let DSR = totalMonthlyInstallment / grossIncome;
    let NDI = netIncome - totalMonthlyInstallment;

    let statusText = "Layak";
    if (DSR > maxDSR) statusText = "Tidak Layak (DSR melebihi had)";
    if (NDI < 1100) statusText = "Tidak Layak (NDI kurang RM1,100)";
    if(netCashOut < 0) statusText = "Tidak Layak (Cash out negatif)";

    let commitCC = Number(document.getElementById('commitCC').value);
    let commitPL = Number(document.getElementById('commitPL').value);
    let commitHL = Number(document.getElementById('commitHL').value);
    let commitOther = Number(document.getElementById('commitOther').value);
    let totalCommitBefore = commitCC + commitPL + commitHL + commitOther;
    // Setelah refinancing, komitmen baru adalah instalmen + komitmen lain (bukan diselesaikan)
    let totalCommitAfter = totalMonthlyInstallment + commitOther;

    showResult({
      name, age, grossIncome, netIncome, mv, outstandingLoan,
      tenure, interestRate, financing90, fec, totalFinancingWithFEC: totalFinancingWithFEC,
      cashOut: netCashoutText,
      monthlyInstallmentAcc1, monthlyInstallmentAcc2, totalMonthlyInstallment,
      DSR, NDI, statusText, serviceFee,
      totalCommitBefore, totalCommitAfter,
      debtPL: debtConsolPL, debtCC: debtConsolCC, totalDebtSettlement,
      option: "OPTION 2 – REFINANCE + DEBT CONSOLIDATION"
    });
  }
}

function calculateReducingBalance(principal, annualInterestRate, years) {
  let r = annualInterestRate / 12;
  let n = years * 12;
  if(r === 0) return principal / n;
  let emi = principal * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
  return emi;
}

function calcServiceFee(totalLoan) {
  if(totalLoan <= 100000) return 3000;
  else if(totalLoan > 100000 && totalLoan < 200000) return totalLoan * 0.03;
  else if(totalLoan >= 200000 && totalLoan < 500000) return totalLoan * 0.02;
  else return totalLoan * 0.01;
}

function currencyFormat(num) {
  return "RM " + num.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function showResult(data) {
  let res = document.getElementById('result');
  let html = `<h2>${data.option}</h2>`;
  html += `<p><strong>Nama:</strong> ${data.name} &nbsp;&nbsp; <strong>Umur:</strong> ${data.age}</p>`;
  html += `<p><strong>Gaji Kasar:</strong> ${currencyFormat(data.grossIncome)} &nbsp;&nbsp; <strong>Gaji Bersih:</strong> ${currencyFormat(data.netIncome)}</p>`;
  html += `<p><strong>Market Value:</strong> ${currencyFormat(data.mv)} &nbsp;&nbsp; <strong>Baki Pinjaman:</strong> ${currencyFormat(data.outstandingLoan)}</p>`;
  html += `<p><strong>Tenure:</strong> ${data.tenure} tahun &nbsp;&nbsp; <strong>Kadar Faedah:</strong> ${(data.interestRate*100).toFixed(2)}% setahun</p>`;
  html += `<p><strong>Maximum New Loan (90% MV):</strong> ${currencyFormat(data.financing90)}</p>`;
  html += `<p><strong>10% FEC (Kos Refinance Approx):</strong> ${currencyFormat(data.fec)}</p>`;

  if(data.option === "OPTION 1 - NORMAL REFINANCE"){
    html += `<p><strong>Total Financing:</strong> ${currencyFormat(data.totalFinancing)}</p>`;
    html += `<p><strong>Bayaran Bulanan:</strong> ${currencyFormat(data.monthlyInstallment)}</p>`;
  } else {
    html += `<p><strong>Total Financing:</strong> ${currencyFormat(data.totalFinancingWithFEC)}</p>`;
    html += `<p><strong>Personal Loan Settlement:</strong> ${currencyFormat(data.debtPL)}</p>`;
    html += `<p><strong>Kad Kredit Settlement:</strong> ${currencyFormat(data.debtCC)}</p>`;
    html += `<p><strong>Jumlah Penyelesaian Hutang:</strong> ${currencyFormat(data.totalDebtSettlement)}</p>`;
    html += `<p><strong>Ansuran Akaun 1 (Housing Loan):</strong> ${currencyFormat(data.monthlyInstallmentAcc1)}</p>`;
    html += `<p><strong>Ansuran Akaun 2 (Debt Consolidation):</strong> ${currencyFormat(data.monthlyInstallmentAcc2)}</p>`;
    html += `<p><strong>Jumlah Bayaran Bulanan:</strong> ${currencyFormat(data.totalMonthlyInstallment)}</p>`;
  }

  html += `<div style="margin-top:20px; padding:15px; background-color:#daa520; color:#000; font-size:1.6em; font-weight:bold; border-radius:8px; text-align:center;">`;
  html += `ANGGARAN CASH OUT:<br><span>${data.cashOut}</span></div>`;

  html += `<hr style="border-color:#bb9933; margin-top:20px; margin-bottom:10px;">`;
  html += `<h3>Perbandingan Komitmen Bulanan</h3>`;
  html += `<p><strong>Jumlah Komitmen Sebelum Refinance:</strong> ${currencyFormat(data.totalCommitBefore)}</p>`;
  html += `<p><strong>Jumlah Komitmen Selepas Refinance:</strong> ${currencyFormat(data.totalCommitAfter)}</p>`;

  let save = data.totalCommitBefore - data.totalCommitAfter;
  let saveText = save >= 0 ? `Jimat RM ${save.toFixed(2)}` : `Bertambah RM ${Math.abs(save).toFixed(2)}`;
  html += `<p><strong>Perubahan Komitmen:</strong> ${saveText}</p>`;

  html += `<p><strong>Service Fee:</strong> ${currencyFormat(data.serviceFee)}</p>`;
  html += `<p><strong>DSR:</strong> ${(data.DSR * 100).toFixed(2)}% &nbsp;&nbsp; <strong>NDI:</strong> ${currencyFormat(data.NDI)}</p>`;
  html += `<p style="font-weight:bold;">Status: ${data.statusText}</p>`;

  res.innerHTML = html;
  res.style.display = 'block';
}
</script>

</body>
</html>
